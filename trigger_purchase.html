<!DOCTYPE html>
<html lang="en">
<head>
    <title>Purchase Menu Item</title>
    <meta charset="utf-8">
    <style>
        label { display: block; float:left; width:20%; }
        input { display: block; width: 20% }
        #submit { width: 10%; margin-top: 2rem; margin-left: 20%; }
    </style>
</head>
<body>

<h2>Simulate Purchase (Trigger Demo)</h2>

<form method="get" action="trigger_purchase.php">
    <label for="item">Menu Item ID:</label>
    <input type="number" name="item" id="item" required>

    <label for="qty">Quantity Purchased:</label>
    <input type="number" name="qty" id="qty" required>

    <input type="submit" id="submit" value="Submit Purchase">
</form>

</body>
</html>
