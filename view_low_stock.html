        ];

  
        const totalStock = menuItems.reduce((sum, item) => sum + item.qty, 0);
        const average = totalStock / menuItems.length;

        
        const lowStockItems = menuItems.filter(item => item.qty < average);

        
        const outputDiv = document.getElementById("php-result");

        if (lowStockItems.length > 0) {
            let html = "<table border='1' style='color: red;'>";
            html += "<tr><th>Item Name</th><th>Stock Quantity</th></tr>";
            
            lowStockItems.forEach(item => {
                html += `<tr><td>${item.name}</td><td>${item.qty}</td></tr>`;
            });
            
            html += "</table>";
            outputDiv.innerHTML = html;
        } else {
            outputDiv.innerHTML = "All items are stocked above average levels.";
        }
